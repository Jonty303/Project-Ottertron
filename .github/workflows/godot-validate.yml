name: Validate Godot 4.5.2 project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.5.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.5.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' godot-import.log; then exit 1; fi

      - name: Launch project for three frames
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --quit-after 3 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' godot-smoke.log; then exit 1; fi

      - name: Wave, victory, defeat and power-up logic tests
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://tests/waves_smoke.gd 2>&1 | tee godot-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|OTTERTRON TEST FAILED' godot-tests.log; then exit 1; fi

      - name: Enemy types and friendly-fire pencil tests
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://tests/variants_smoke.gd 2>&1 | tee godot-variants.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|OTTERTRON VARIANT TEST FAILED' godot-variants.log; then exit 1; fi

      - name: Arena hazards healing and Chaos boon tests
        shell: bash
        run: |
          set -o pipefail
          timeout 40s stdbuf -oL -eL ./godot --headless --path . --script res://tests/environment_boons_smoke.gd 2>&1 | tee godot-environment.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|OTTERTRON ENVIRONMENT TEST FAILED' godot-environment.log; then exit 1; fi

      - name: Camera boundaries and joypad boon input
        shell: bash
        run: |
          set -o pipefail
          timeout 40s ./godot --headless --path . --script res://tests/camera_controller_smoke.gd 2>&1 | tee godot-camera-controller.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|OTTERTRON CAMERA/CONTROLLER TEST FAILED' godot-camera-controller.log; then exit 1; fi
